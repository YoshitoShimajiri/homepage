</style><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>島尻芳人 | 天文学・星形成研究</title><body>
    <div id=root></div>
    <template id="teaching-rules-template">
      <section id="teaching-rules" class="teaching-rules" aria-labelledby="teaching-rules-heading">
        <p class="portfolio-kicker">Teaching / Policy</p>
        <h2 id="teaching-rules-heading">授業ルール</h2>
        <h3>授業Q&amp;A</h3>
        <div class="rules-intro">
          <h4>はじめに</h4>
          <p>以下の内容は、<strong>私が担当する授業における対応方針です。</strong></p>
          <p><strong>他の先生が担当する授業には適用されません。</strong> 出欠、課題、成績評価、特別欠席、補講等の扱いは、担当教員や授業によって異なる場合があります。</p>
          <p>他の先生の授業については、その授業のシラバスや担当教員からの案内を確認してください。</p>
          <p>できるだけ学生のみなさんが困らないよう、相談や提出の機会は設けています。一方で、全員を公平に扱うため、出欠や提出期限などについて一定のルールを設けています。</p>
          <p>困ったことや特別な事情がある場合は、<strong>期限が過ぎてからではなく、事前に相談してください。</strong></p>
          <p><strong>事後の相談については、原則として対応しません。</strong></p>
          <p>授業についてわからないことや相談したいことがある場合は、<strong>まず以下のQ&amp;Aを確認してください。</strong></p>
          <p>それでも解決しない場合や、自分の場合にどう対応すればよいかわからない場合は、<strong>Q&amp;Aから相談してください。</strong></p>
        </div>
        <div class="rules-qa">
        <nav class="rules-category-nav" aria-label="授業Q&Aのジャンル"><a href="#rules-attendance">出席・遅刻・履修</a><a href="#rules-special-absence">特別欠席</a><a href="#rules-assignments">課題・提出</a><a href="#rules-grades">成績・授業参加</a><a href="#rules-support">学習サポート・補講</a></nav>
          <div class="rules-category" id="rules-attendance">
            <h4>出席・遅刻・履修</h4>
            <details><summary>Q. 出席・遅刻はどのように扱われますか？</summary>
            <p>授業開始時に、スマートフォンからUNIPAで出席登録をしてください。<strong>出席登録ができるのは、授業開始から3分間です。</strong></p>
            <p>何らかの事情でUNIPAに登録できない場合は、<strong>その場で黒板に学籍番号を書いてください。</strong> 授業開始から3分を過ぎてから申し出た場合は、遅刻扱いとなります。</p>
            <p>授業開始から<strong>4分後以降20分以内</strong>に入室した場合は、遅刻として扱います。私に声をかける必要はありませんので、黒板の「遅刻」欄に学籍番号を記載してください。</p>
            <p>授業開始から<strong>21分以降に入室した場合は、受講することはできますが、出欠上は欠席扱い</strong>となります。</p>
            <p>ただし、<strong>遅延証明書がある場合は、この限りではありません。</strong></p>
          </details>
            <details><summary>Q. 履修修正期間に追加登録しました。登録前の授業も出席扱いになりますか？</summary><p>履修登録前であっても、<strong>事前に申告したうえで授業に出席していた場合は、出席として扱います。</strong></p><p>一方、登録前の授業に出席していなかった場合は、追加登録後であっても、その回を出席扱いにはしません。</p></details>
            <details><summary>Q. ○月○日の授業に出席していましたが、欠席になっています。</summary><p>授業の出欠はUNIPAで確認しています。</p><p>欠席になっている場合は、UNIPA上で出席登録が完了していないということです。</p><p><strong>出席登録ができていない場合は、その授業中に申し出てください。原則として、授業終了後の出欠に関する申し出には対応しません。</strong></p><p>ただし、授業中に申し出たにもかかわらず、その修正が反映されていない場合は、遠慮なくQ&amp;Aから連絡してください。</p></details>
            <details><summary>Q. UNIPAで出席登録したのに、欠席になっています。</summary><p>私の授業では、UNIPAでの出席登録とは別に、<strong>不定期に点呼でも出席確認を行います。</strong></p><p>UNIPAで出席登録されていても、点呼で出席が確認できなかった場合は、欠席扱いになります。</p><p>そのため、<strong>UNIPAへの登録だけで出席が確定するわけではありません。</strong></p></details>
            <details><summary>Q. 6回欠席で失格になりそうです。なんとかなりませんか？</summary><p><strong>なりません。</strong></p><p>出欠の基準は、すべての履修者に同じように適用します。</p><p>欠席回数が失格の基準に達した場合、個別の事情によって変更することはありません。</p><p>出欠状況は各自で早めに確認してください。</p></details>
          </div>
          <div class="rules-category" id="rules-special-absence">
            <h4>特別欠席</h4>
            <details><summary>Q. 特別欠席のときは、どうすればいいですか？</summary><p>特別欠席になることが分かった時点で、できるだけ早くQ&amp;Aから連絡してください。</p></details>
            <details><summary>Q. 特別欠席で課題を提出したのに、出欠に反映されていません。</summary><p>特別欠席については、他の特別欠席者とまとめて出欠を反映することがあります。</p><p>そのため、課題を提出してから出欠に反映されるまでに時間がかかる場合があります。</p></details>
            <details><summary>Q. 特別欠席届を提出したのに、欠席になっています。</summary><p>特別欠席届を提出しただけでは、出席扱いにはなりません。</p><p><strong>特別欠席届を提出し、特別課題を授業日から2週間以内に提出した場合に出席扱いとなります。</strong></p><p>事情があり、期限内の提出が難しい場合は、<strong>必ず締め切り前にQ&amp;Aから相談してください。</strong></p><p>両方の条件を満たしているにもかかわらず欠席になっている場合は、<strong>第15週の授業が終了するまでにQ&amp;Aから問い合わせてください。</strong></p></details>
          </div>
          <div class="rules-category" id="rules-assignments">
            <h4>課題・提出</h4>
            <details><summary>Q. 課題の提出期限が過ぎてしまいました。どうしたらいいですか？</summary><p>提出期限を過ぎていても、まずは課題を提出してください。</p><p>ただし、期限内に提出した人と同じ扱いにはできないため、<strong>減点のうえで受け付けます。</strong></p></details>
            <details><summary>Q. 課題を提出したつもりですが、未提出になっています。</summary><p>課題を提出した際は、<strong>提出が完了していることを各自で必ず確認してください。</strong></p><p>システム上に提出記録がない場合は、原則として未提出として扱います。</p></details>
            <details><summary>Q. 課題を間違ったファイルで提出しました。差し替えできますか？</summary><p>差し替えは可能です。</p><p><strong>提出期限内であれば減点なし</strong>で差し替えを受け付けます。</p><p><strong>提出期限を過ぎてからの差し替えは、減点のうえで受け付けます。</strong></p></details>
            <details><summary>Q. 欠席した日の授業内容や課題は、どう確認すればいいですか？</summary><p>UNIPAや授業資料を各自で確認し、必要な課題に取り組んでください。</p><p><strong>欠席した場合でも、課題を提出すれば課題点は通常どおり評価します。</strong></p><p>自分だけでは対応が難しい場合は、オフィスアワーに来てください。</p></details>
          </div>
          <div class="rules-category" id="rules-grades">
            <h4>成績・授業参加</h4>
            <details><summary>Q. 欠席は5回以内で、課題なども提出しているのに「不可」なのはなぜですか？</summary><p>出席回数や課題の提出状況だけで成績が決まるわけではありません。</p><p>それぞれの課題や試験等を採点し、その結果をもとに総合点を算出しています。</p><p><strong>総合点が合格点に達していない場合は、課題を提出していても「不可」となることがあります。</strong></p></details>
            <details><summary>Q. 授業中に居眠り、スマートフォンの使用、おしゃべりなどで個別に注意されました。成績に影響しますか？</summary><p>授業への参加状況は、成績評価のうち<strong>参加意欲点</strong>に反映しています。</p><p>居眠り、授業と関係のないスマートフォンの使用、私語などについては、1回注意されたことで、すぐに成績へ大きく影響するわけではありません。ただし、<strong>複数回個別に注意を受けた場合は、参加意欲点に反映することがあります。</strong></p><p>一方で、<strong>イヤホンをつけたまま授業を受ける、ゲームをするなど、明らかに授業に参加する意思がないと判断される行為については、1回目の注意から参加意欲点に反映することがあります。</strong></p><p>なお、スマートフォンについては、<strong>授業中に使用するよう指示があった場合や、授業資料を閲覧するために使用している場合は問題ありません。</strong></p><p>私の授業の多くは、授業中に自分で考えたり、周りの人と一緒に作業したりすることを大切にしています。特に毎回課題がある授業では、授業中に一緒に取り組むことが課題を進めるうえでも重要です。</p><p>授業の時間を有効に使えるよう、できるだけ集中して参加してください。</p></details>
          </div>
          <div class="rules-category" id="rules-support">
            <h4>学習サポート・補講</h4>
            <details><summary>Q. ノートパソコンを使う授業を受けていますが、ノートパソコンが壊れました。どうしたらいいですか？</summary><p>購入した店舗やメーカーのサポート窓口などに相談してください。</p></details>
            <details><summary>Q. 課題のやり方がわかりません。</summary><p>わからないまま一人で悩む必要はありません。オフィスアワーの時間に相談に来てください。</p><p>どこが分からないのかを一緒に確認しながら、進め方を説明します。</p></details>
            <details><summary>Q. まとめのテストに自信がありません。どうしたらいいですか？</summary><p>テスト範囲は各授業で明示していますので、まずは<strong>テスト範囲に含まれる授業内容を復習してください。</strong></p><p>わからないところがある場合は、オフィスアワーで質問してもらって構いません。</p><p>それでも不安がある場合は、希望に応じて<strong>試験前に追加の学習サポートの時間を設けることもあります。</strong> 希望する場合は、準備の都合がありますので、<strong>テストの1か月以上前までに相談してください。</strong></p></details>
            <details><summary>Q. 補講日に予定があって出席できません。出席扱いになりませんか？</summary><p>原則として、出席扱いにはなりません。</p><p>私の授業では、補講日は<strong>1か月以上前にお知らせしていることがほとんどです</strong>ので、できるだけ事前に予定を調整してください。</p><p>ただし、<strong>他の授業と時間が重なっている場合など、やむを得ない事情がある場合は事前に相談してください。</strong></p></details>
          </div>
        </div>
