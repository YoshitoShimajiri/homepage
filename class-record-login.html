<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ClassRecord | ログイン</title>
  <style>
    :root{--blue:#1a3aff;--ink:#0a0c12;--muted:#596171;--line:#dce2ee;--bg:#f7f9ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:1.5rem}
    main{width:min(100%,430px);background:#fff;border:1px solid var(--line);padding:clamp(2rem,7vw,3.25rem)}
    .kicker{font:600 .7rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:1rem}
    h1{font-size:clamp(1.65rem,6vw,2.25rem);line-height:1.3;margin:0 0 .75rem}
    .intro{font-size:.88rem;line-height:1.8;color:var(--muted);margin:0 0 2rem}
    label{display:block;font-size:.78rem;font-weight:700;margin:1rem 0 .45rem}
    input{width:100%;font:inherit;padding:.85rem .9rem;border:1px solid #bfc8da;border-radius:0;background:#fff;color:var(--ink)}
    input:focus{outline:2px solid var(--blue);outline-offset:2px;border-color:var(--blue)}
    button{width:100%;margin-top:1.5rem;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:.9rem;font:700 .85rem/1.3 inherit;cursor:pointer}
    button:hover{background:#fff;color:var(--blue)}
    #error{min-height:1.5em;margin:.85rem 0 0;color:#a51d2d;font-size:.78rem;line-height:1.6}
    .note{border-top:1px solid var(--line);padding-top:1rem;margin:1.4rem 0 0;color:var(--muted);font-size:.7rem;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <div class="kicker">Teaching Tool / Private Access</div>
    <h1>授業観察記録</h1>
    <p class="intro">ClassRecordを開くには、ユーザー名とパスワードを入力してください。</p>
    <form id="login-form">
      <label for="username">ユーザー名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">ClassRecordを開く</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
    <p class="note">この画面は簡易的なアクセス制限です。入力内容は外部へ送信されません。</p>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      if (username === 'ClassRecord' && password === 'ClassRecord') {
        window.location.replace('./ClassRecord.html');
        return;
      }
      error.textContent = 'ユーザー名またはパスワードが違います。';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    });
  </script>
</body>
</html>
