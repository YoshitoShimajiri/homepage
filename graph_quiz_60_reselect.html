<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>グラフ読解クイズ 60問</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#d9dce1;--ok:#0a7a33;--ng:#b42318;--accent:#1f5fbf}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px 60px}h1{font-size:32px;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 18px;line-height:1.7}
.start{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 4px 14px rgba(0,0,0,.04)}.start h2{margin:0 0 16px}.modeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.modeBtn,.startBtn,.backBtn{font:inherit;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;cursor:pointer}.modeBtn:hover,.startBtn:hover,.backBtn:hover{border-color:var(--accent);background:#f4f8ff}.modeBtn.active{border-color:var(--accent);background:#eef4ff;font-weight:700}.numberArea{display:none;margin-top:16px}.numberArea label{display:block;font-weight:700;margin-bottom:8px}.numberArea select{font:inherit;width:100%;max-width:240px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.startBtn{margin-top:16px;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}.startBtn:hover{background:#174d9d}.backBtn{margin-bottom:14px;padding:9px 12px}
.progressWrap{display:none;position:sticky;top:0;z-index:20;background:rgba(247,247,248,.94);backdrop-filter:blur(8px);padding:10px 0 14px;margin-bottom:10px}.progressText{font-size:14px;color:var(--muted);margin-bottom:6px}.progressBar{height:8px;background:#e8eaee;border-radius:99px;overflow:hidden}.progressBar>div{height:100%;width:0;background:var(--accent);transition:.2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 20px;box-shadow:0 4px 14px rgba(0,0,0,.04)}.qno{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:6px}.tag,.difficulty{display:inline-block;font-size:12px;border-radius:999px;padding:4px 9px;margin-left:8px}.tag{background:#eef3fb;color:#244a7c}.difficulty{font-weight:700}.difficulty.beginner{background:#eefaf2;color:#176c36}.difficulty.intermediate{background:#fff7e6;color:#9a5b00}.difficulty.advanced{background:#fff1f0;color:#a22920}
h2{font-size:21px;line-height:1.5;margin:0 0 16px}.chartbox{height:300px;margin:10px 0 18px}.choices{display:grid;gap:10px}button.choice{font-family:inherit;text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;font-size:16px;cursor:pointer;transition:.15s}button.choice:hover{border-color:var(--accent);background:#f4f8ff}button.choice:disabled{cursor:default;opacity:1}button.choice.correct{border-color:var(--ok);background:#eefaf2}button.choice.wrong{border-color:var(--ng);background:#fff1f0}.feedback{display:none;margin-top:14px;padding:14px;border-radius:12px;line-height:1.65}.feedback.ok{display:block;background:#eefaf2;border:1px solid #b7e2c5}.feedback.ng{display:block;background:#fff1f0;border:1px solid #f0b7b3}
.result{display:none;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 20px;margin-top:24px}.score{font-size:46px;font-weight:800;margin:8px 0}.breakdown{margin:18px auto 0;max-width:520px;text-align:left}.breakdown div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.reset{margin-top:18px;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:12px 18px;font-size:16px;cursor:pointer}.note{font-size:13px;color:var(--muted);margin-top:8px}.hidden{display:none!important}
@media(max-width:700px){h1{font-size:26px}.chartbox{height:240px}.card{padding:16px}.modeGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>グラフ読解クイズ 60問</h1>
<p class="lead">グラフから「確実に言えること」を判断するクイズです。選択すると、その場で正解・不正解と解説が表示されます。回答後でも別の選択肢に変更できます。初級・中級・上級の難易度ラベル付きです。最初に出題方法を選んでください。</p>
<div id="startScreen" class="start">
  <h2>出題方法</h2>
  <div class="modeGrid">
    <button class="modeBtn active" data-mode="all" onclick="selectMode('all',this)">全問表示<br><small>60問すべて</small></button>
    <button class="modeBtn" data-mode="number" onclick="selectMode('number',this)">問題番号を選択<br><small>指定した1問</small></button>
    <button class="modeBtn" data-mode="random" onclick="selectMode('random',this)">ランダムに1問<br><small>60問から抽選</small></button>
  </div>
  <div id="numberArea" class="numberArea"><label for="questionNumber">問題番号</label><select id="questionNumber"></select></div>
  <button class="startBtn" onclick="startQuiz()">クイズを開始</button>
</div>
<div id="quizArea" class="hidden">
  <button class="backBtn" onclick="backToMenu()">← 出題方法を選び直す</button>
  <div id="progressWrap" class="progressWrap"><div id="progressText" class="progressText"></div><div class="progressBar"><div id="progressFill"></div></div></div>
  <div id="quiz"></div>
  <div id="result" class="result"><div>あなたの得点</div><div id="score" class="score"></div><div id="message"></div><div id="breakdown" class="breakdown"></div><button class="reset" onclick="restartCurrent()">同じ形式でもう一度</button><div class="note">このクイズのデータはすべて授業用の架空データです。</div></div>
</div>
</div>
<script>
const questions = [
{difficulty:'中級',category:'数値',title:'ある店舗の月別売上です。このグラフから確実に言えることはどれですか？',type:'line',labels:['4月','5月','6月','7月','8月'],data:[100,110,105,130,150],yLabel:'売上（万円）',options:['8月の売上は4月より50万円高い','広告を増やしたため売上が増えた','夏になると必ず売上が増える','来年8月も150万円以上になる'],answer:0,explanation:'4月100万円、8月150万円なので差は50万円です。原因や将来予測はこのグラフだけでは判断できません。'},
{difficulty:'中級',category:'解釈',title:'A大学とB大学の学生満足度です。最も適切な解釈はどれですか？',type:'bar',labels:['A大学','B大学'],data:[80,60],yLabel:'満足度（%）',options:['A大学の学生はB大学より必ず20%幸せである','この結果だけで大学全体の評価を断定するのは難しい','B大学では60%の学生が退学する','A大学の教育水準はB大学より必ず高い'],answer:1,explanation:'満足度は1つの指標です。教育水準や退学率まで断定するには別の情報が必要です。'},
{difficulty:'初級',category:'数値',title:'X市とY市の人口です。正しい記述はどれですか？',type:'bar',labels:['X市','Y市'],data:[120000,100000],yLabel:'人口（人）',options:['X市はY市より20,000人多い','X市はY市の2倍である','Y市はX市より20%多い','人口差は判断できない'],answer:0,explanation:'120,000−100,000＝20,000人です。'},
{difficulty:'上級',category:'相関',title:'商品の評価点と購入額の関係です。最も適切な解釈はどれですか？',type:'scatter',scatter:[{x:1,y:1200},{x:2,y:1800},{x:3,y:2600},{x:4,y:3300},{x:5,y:4100}],xLabel:'評価点',yLabel:'購入額（円）',options:['評価点が高いほど購入額も高い傾向がある','評価点を1上げれば必ず900円増える','購入額が高いことが評価点の原因である','すべての顧客で同じ関係が成り立つ'],answer:0,explanation:'正の関連は見られますが、一定額の増加や因果関係までは示せません。'},
{difficulty:'上級',category:'軸',title:'売上指数98と103を、縦軸95〜105で表示しています。最も注意すべき点はどれですか？',type:'barTruncated',labels:['前年','今年'],data:[98,103],yLabel:'売上指数',yMin:95,yMax:105,options:['差が実際以上に大きく見えやすい','棒グラフでは前年比較をしてはいけない','2つのデータではグラフを作れない','103は98の2倍以上である'],answer:0,explanation:'縦軸を95から始めると、5ポイント差が視覚的に大きく見えます。'},
{difficulty:'中級',category:'割合',title:'あるクラスの出席率です。4月80%、5月84%でした。正しい記述はどれですか？',type:'bar',labels:['4月','5月'],data:[80,84],yLabel:'出席率（%）',options:['4ポイント上昇した','4%分だけ学生数が増えた','20%上昇した','出席者が必ず4人増えた'],answer:0,explanation:'80%から84%への変化は4パーセントポイントです。人数の増加は母数が分からないと判断できません。'},
{difficulty:'初級',category:'割合',title:'A商品のシェアは40%、B商品は30%、C商品は20%、D商品は10%です。最大のシェアはどれですか？',type:'pie',labels:['A商品','B商品','C商品','D商品'],data:[40,30,20,10],yLabel:'シェア（%）',options:['A商品','B商品','C商品','D商品'],answer:0,explanation:'A商品が40%で最も大きいシェアです。'},
{difficulty:'中級',category:'平均',title:'クラスAとクラスBの平均点です。最も適切な記述はどれですか？',type:'bar',labels:['クラスA','クラスB'],data:[72,72],yLabel:'平均点',options:['両クラスの平均点は同じ','両クラスの点数分布も同じ','両クラスの最高点も同じ','両クラスの人数も同じ'],answer:0,explanation:'平均点が同じことは分かりますが、分布、最高点、人数までは分かりません。'},
{difficulty:'上級',category:'母数',title:'アンケートで「満足」と答えた割合です。A店90%、B店80%でした。A店は10人、B店は1000人が回答しています。最も適切な解釈はどれですか？',type:'bar',labels:['A店(n=10)','B店(n=1000)'],data:[90,80],yLabel:'満足（%）',options:['A店の方が必ず優れている','割合だけでなく回答者数も考慮すべきである','回答者数は結果の解釈に関係ない','B店の満足者は80人である'],answer:1,explanation:'割合だけでなく母数も重要です。B店は1000人の80%なので満足者は800人です。'},
{difficulty:'中級',category:'相関',title:'勉強時間とテスト得点の散布図です。どのような傾向が見られますか？',type:'scatter',scatter:[{x:1,y:50},{x:2,y:55},{x:3,y:61},{x:4,y:68},{x:5,y:74},{x:6,y:79}],xLabel:'勉強時間（時間）',yLabel:'得点',options:['勉強時間が長いほど得点が高い傾向がある','6時間勉強すれば必ず79点になる','得点が高いから勉強時間が増えると断定できる','勉強時間と得点に関係は見られない'],answer:0,explanation:'正の相関傾向は見られますが、必然性や因果方向は断定できません。'},
{difficulty:'初級',category:'変化率',title:'利用者数が100人から120人に増えました。増加率は何%ですか？',type:'bar',labels:['前年','今年'],data:[100,120],yLabel:'利用者数（人）',options:['20%','16.7%','120%','200%'],answer:0,explanation:'増加は20人で、20÷100＝0.20なので20%増です。'},
{difficulty:'初級',category:'変化率',title:'価格が2000円から1500円に下がりました。減少率は何%ですか？',type:'bar',labels:['変更前','変更後'],data:[2000,1500],yLabel:'価格（円）',options:['25%','33.3%','50%','75%'],answer:0,explanation:'500円減で、500÷2000＝0.25なので25%減です。'},
{difficulty:'初級',category:'時系列',title:'アクセス数の推移です。最もアクセス数が少ない月はどれですか？',type:'line',labels:['1月','2月','3月','4月','5月'],data:[500,450,470,520,560],yLabel:'アクセス数',options:['1月','2月','3月','4月'],answer:1,explanation:'最小値は2月の450です。'},
{difficulty:'中級',category:'時系列',title:'売上の推移です。「毎月増加している」と言えますか？',type:'line',labels:['1月','2月','3月','4月'],data:[100,120,115,140],yLabel:'売上（万円）',options:['言えない。3月に減少している','言える。最終的に増えている','言える。4月が最高だから','判断できない'],answer:0,explanation:'2月120から3月115へ減少しているため、「毎月増加」は誤りです。'},
{difficulty:'初級',category:'割合',title:'支出の内訳です。家賃50%、食費25%、交通費15%、その他10%でした。家賃と食費を合わせると何%ですか？',type:'pie',labels:['家賃','食費','交通費','その他'],data:[50,25,15,10],yLabel:'構成比（%）',options:['75%','65%','50%','25%'],answer:0,explanation:'50%＋25%＝75%です。'},
{difficulty:'上級',category:'割合',title:'円グラフの値が40%、35%、30%となっています。最も重要な問題は何ですか？',type:'pie',labels:['A','B','C'],data:[40,35,30],yLabel:'割合（%）',options:['合計が105%になっている','項目が3つしかない','最大が40%しかない','円グラフでは割合を示せない'],answer:0,explanation:'構成比として同一の全体を分けるなら合計は100%になる必要があります。この値は105%です。'},
{difficulty:'上級',category:'平均',title:'5人の点数が60、70、70、80、120点でした。平均点として表示された80点について最も注意すべき点はどれですか？',type:'bar',labels:['平均点'],data:[80],yLabel:'点',options:['極端に高い値が平均を押し上げている可能性がある','平均点は必ず中央値と同じである','5人では平均を計算できない','平均点80なら全員80点である'],answer:0,explanation:'120点という高い値が平均を押し上げています。平均だけでは分布を十分に表せない場合があります。'},
{difficulty:'初級',category:'比較',title:'商品Aは80個、商品Bは120個売れました。BはAの何倍ですか？',type:'bar',labels:['商品A','商品B'],data:[80,120],yLabel:'販売個数',options:['1.5倍','1.2倍','2倍','40倍'],answer:0,explanation:'120÷80＝1.5倍です。'},
{difficulty:'初級',category:'比較',title:'A地区200人、B地区300人、C地区500人です。全体に占めるC地区の割合は何%ですか？',type:'bar',labels:['A地区','B地区','C地区'],data:[200,300,500],yLabel:'人数',options:['50%','20%','30%','80%'],answer:0,explanation:'合計1000人のうち500人なので50%です。'},
{difficulty:'上級',category:'因果',title:'アイスの売上と熱中症搬送者数が同じ時期に増えています。最も適切な解釈はどれですか？',type:'lineMulti',labels:['4月','5月','6月','7月','8月'],datasets:[{label:'アイス売上指数',data:[20,30,50,80,90]},{label:'搬送者指数',data:[10,15,30,70,85]}],yLabel:'指数',options:['両方が増える背景に気温など別の要因がある可能性がある','アイスを食べると熱中症になると断定できる','熱中症が増えると必ずアイスが売れる','2本の線が似ていれば因果関係が証明される'],answer:0,explanation:'相関があっても因果とは限りません。気温のような第三の要因が両方に影響している可能性があります。'},
{difficulty:'中級',category:'軸',title:'同じデータを0〜100の縦軸で表示しています。差の見え方について最も適切なのはどれですか？',type:'barFixed',labels:['A','B'],data:[48,52],yLabel:'得点',yMin:0,yMax:100,options:['4点差であることは変わらない','差は50点である','BはAの2倍である','軸が0からなら必ず正しい結論になる'],answer:0,explanation:'見た目の大きさに関係なく、数値差は52−48＝4点です。'},
{difficulty:'中級',category:'母数',title:'Aクラスは10人中8人、Bクラスは100人中70人が合格しました。合格率が高いのはどちらですか？',type:'bar',labels:['Aクラス','Bクラス'],data:[80,70],yLabel:'合格率（%）',options:['Aクラス','Bクラス','同じ','人数が違うので比較できない'],answer:0,explanation:'Aは80%、Bは70%なので合格率はAが高いです。人数の違いは不確実性の考慮には重要ですが、割合自体は比較できます。'},
{difficulty:'初級',category:'数値',title:'2024年から2025年の利用者数の増加人数はいくつですか？',type:'bar',labels:['2024年','2025年'],data:[350,410],yLabel:'利用者数（人）',options:['60人','17人','760人','410人'],answer:0,explanation:'410−350＝60人です。'},
{difficulty:'中級',category:'変化率',title:'利用者数が350人から410人になりました。増加率として最も近いものはどれですか？',type:'bar',labels:['2024年','2025年'],data:[350,410],yLabel:'利用者数（人）',options:['約17.1%','約60%','約14.6%','約117%'],answer:0,explanation:'増加率は60÷350×100≒17.1%です。'},
{difficulty:'中級',category:'相関',title:'散布図を見ると点が広くばらついています。最も適切な記述はどれですか？',type:'scatter',scatter:[{x:1,y:50},{x:2,y:72},{x:3,y:48},{x:4,y:75},{x:5,y:52},{x:6,y:70}],xLabel:'利用回数',yLabel:'満足度',options:['明確な直線的関係は読み取りにくい','強い正の相関がある','完全な負の相関がある','利用回数が満足度を必ず決める'],answer:0,explanation:'点が上下に広く分布しており、明確な直線的傾向は読み取りにくいです。'},
{difficulty:'中級',category:'解釈',title:'ある大学の就職率が95%と示されています。このグラフだけからは分からないことはどれですか？',type:'bar',labels:['就職率'],data:[95],yLabel:'就職率（%）',options:['調査対象者数や算出方法','表示された割合が95%であること','100%未満であること','50%より高いこと'],answer:0,explanation:'95%という値は読めますが、対象者数や就職率の定義・算出方法はグラフだけでは分かりません。'},
{difficulty:'初級',category:'時系列',title:'気温の推移です。最も大きく上昇した区間はどこですか？',type:'line',labels:['月','火','水','木','金'],data:[20,21,25,26,27],yLabel:'気温（℃）',options:['火→水','月→火','水→木','木→金'],answer:0,explanation:'火曜21℃から水曜25℃へ4℃上昇し、他の区間の1℃より大きいです。'},
{difficulty:'初級',category:'比較',title:'A店の売上は300万円、B店は250万円です。A店はB店より何万円多いですか？',type:'bar',labels:['A店','B店'],data:[300,250],yLabel:'売上（万円）',options:['50万円','20万円','120万円','550万円'],answer:0,explanation:'300−250＝50万円です。'},
{difficulty:'上級',category:'解釈',title:'SNS投稿数が急増した直後に来店者数も増えました。最も慎重な表現はどれですか？',type:'lineMulti',labels:['1週','2週','3週','4週'],datasets:[{label:'投稿数指数',data:[20,25,80,85]},{label:'来店者指数',data:[30,32,50,60]}],yLabel:'指数',options:['SNS投稿増加と来店者増加が同時期に見られる','SNS投稿が来店者増加の唯一の原因である','SNS投稿を増やせば必ず来店者が増える','来店者が増えたのは偶然だと断定できる'],answer:0,explanation:'時期が重なることは言えますが、原因がSNSだけだと断定するには追加の検証が必要です。'},
{difficulty:'初級',category:'割合',title:'男女比が男性60人、女性40人です。女性の割合は何%ですか？',type:'pie',labels:['男性','女性'],data:[60,40],yLabel:'人数',options:['40%','60%','25%','50%'],answer:0,explanation:'全体100人のうち女性40人なので40%です。'}

let selectedMode='all', activeIndices=[], answered=0, score=0, categoryStats={}, difficultyStats={}, chartInstances=[], selectedAnswers={};
const select=document.getElementById('questionNumber');
questions.forEach((q,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`問題 ${i+1}（${q.difficulty}・${q.category}）`;select.appendChild(o)});
function selectMode(mode,btn){selectedMode=mode;document.querySelectorAll('.modeBtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('numberArea').style.display=mode==='number'?'block':'none'}
function startQuiz(){if(selectedMode==='all')activeIndices=questions.map((_,i)=>i);else if(selectedMode==='number')activeIndices=[Number(select.value)];else activeIndices=[Math.floor(Math.random()*questions.length)];renderQuiz();document.getElementById('startScreen').classList.add('hidden');document.getElementById('quizArea').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function resetStats(){answered=0;score=0;selectedAnswers={};categoryStats={};difficultyStats={'初級':{correct:0,total:0},'中級':{correct:0,total:0},'上級':{correct:0,total:0}};activeIndices.forEach(i=>{const q=questions[i];if(!categoryStats[q.category])categoryStats[q.category]={correct:0,total:0};categoryStats[q.category].total++;difficultyStats[q.difficulty].total++})}
function renderQuiz(){chartInstances.forEach(c=>c.destroy());chartInstances=[];resetStats();const quiz=document.getElementById('quiz');quiz.innerHTML='';document.getElementById('result').style.display='none';const pw=document.getElementById('progressWrap');pw.style.display='block';updateProgress();activeIndices.forEach((realIndex,pos)=>renderQuestion(realIndex,pos));}
function renderQuestion(qi,pos){const q=questions[qi],quiz=document.getElementById('quiz');const card=document.createElement('section');card.className='card';const diffClass=q.difficulty==='初級'?'beginner':q.difficulty==='中級'?'intermediate':'advanced';const shownNo=activeIndices.length===1?`問題 ${qi+1}`:`問題 ${qi+1} / ${questions.length}`;card.innerHTML=`<div class="qno">${shownNo}<span class="difficulty ${diffClass}">${q.difficulty}</span><span class="tag">${q.category}</span></div><h2>${q.title}</h2><div class="chartbox"><canvas id="chart${pos}"></canvas></div><div class="choices" id="choices${pos}"></div><div class="feedback" id="feedback${pos}"></div>`;quiz.appendChild(card);const ch=document.getElementById(`choices${pos}`);q.options.forEach((opt,oi)=>{const btn=document.createElement('button');btn.className='choice';btn.textContent=`${String.fromCharCode(65+oi)}. ${opt}`;btn.onclick=()=>answerQuestion(pos,qi,oi);ch.appendChild(btn)});const ctx=document.getElementById(`chart${pos}`);let config;if(q.type==='scatter'){config={type:'scatter',data:{datasets:[{label:'データ',data:q.scatter,pointRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:q.xLabel}},y:{title:{display:true,text:q.yLabel},beginAtZero:false}}}}}else if(q.type==='pie'){config={type:'pie',data:{labels:q.labels,datasets:[{data:q.data,borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}}else if(q.type==='lineMulti'){config={type:'line',data:{labels:q.labels,datasets:q.datasets.map(d=>({...d,borderWidth:2,tension:.25,fill:false}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{title:{display:true,text:q.yLabel},beginAtZero:true}}}}}else{config={type:q.type==='line'?'line':'bar',data:{labels:q.labels,datasets:[{label:q.yLabel,data:q.data,borderWidth:2,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:q.yLabel},beginAtZero:!(q.type==='barTruncated'),...(q.yMin!==undefined?{min:q.yMin}:{}),...(q.yMax!==undefined?{max:q.yMax}:{})}}}}}chartInstances.push(new Chart(ctx,config))}
function answerQuestion(pos,qi,oi){const q=questions[qi],box=document.getElementById(`choices${pos}`),buttons=[...box.querySelectorAll('button')],key=String(qi),prev=selectedAnswers[key];
if(prev===undefined){answered++;}else if(prev===q.answer){score--;categoryStats[q.category].correct--;difficultyStats[q.difficulty].correct--;}
selectedAnswers[key]=oi;
if(oi===q.answer){score++;categoryStats[q.category].correct++;difficultyStats[q.difficulty].correct++;}
buttons.forEach((b,i)=>{b.disabled=false;b.classList.remove('correct','wrong');if(i===oi){if(i===q.answer)b.classList.add('correct');else b.classList.add('wrong');}});
const fb=document.getElementById(`feedback${pos}`);if(oi===q.answer){fb.className='feedback ok';fb.innerHTML=`<strong>正解です。</strong><br>${q.explanation}`}else{fb.className='feedback ng';fb.innerHTML=`<strong>不正解です。</strong><br>${q.explanation}`}
updateProgress();if(answered===activeIndices.length)showResult();else document.getElementById('result').style.display='none';}
function updateProgress(){document.getElementById('progressText').textContent=`回答済み ${answered} / ${activeIndices.length}`;document.getElementById('progressFill').style.width=`${activeIndices.length?answered/activeIndices.length*100:0}%`}
function showResult(){document.getElementById('score').textContent=`${score} / ${activeIndices.length}`;let msg='';const rate=score/activeIndices.length;if(rate>=.9)msg='非常によく読めています。数値だけでなく、因果関係やグラフの見せ方にも注意できています。';else if(rate>=.75)msg='よく読めています。間違えた分野を確認すると、さらに安定します。';else if(rate>=.6)msg='基本はつかめています。割合・因果関係・母数・軸の設定を重点的に確認してみましょう。';else msg='グラフは見た印象ではなく、数値・母数・軸・因果関係を一つずつ確認することが大切です。';document.getElementById('message').textContent=msg;const b=document.getElementById('breakdown');b.innerHTML='<strong>難易度別結果</strong>';Object.entries(difficultyStats).filter(([k,v])=>v.total>0).forEach(([k,v])=>{const row=document.createElement('div');row.innerHTML=`<span>${k}</span><strong>${v.correct} / ${v.total}</strong>`;b.appendChild(row)});const heading=document.createElement('p');heading.style.margin='20px 0 4px';heading.innerHTML='<strong>分野別結果</strong>';b.appendChild(heading);Object.entries(categoryStats).forEach(([k,v])=>{const row=document.createElement('div');row.innerHTML=`<span>${k}</span><strong>${v.correct} / ${v.total}</strong>`;b.appendChild(row)});const result=document.getElementById('result');result.style.display='block';result.scrollIntoView({behavior:'smooth'})}
function restartCurrent(){if(selectedMode==='random')activeIndices=[Math.floor(Math.random()*questions.length)];renderQuiz();window.scrollTo({top:0,behavior:'smooth'})}
function backToMenu(){chartInstances.forEach(c=>c.destroy());chartInstances=[];document.getElementById('quizArea').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
</script>
