<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101929"><title>卓球スコアボード</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:#f4f7fc;background:#101929;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));min-height:100svh}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:48px;border:1px solid #ffffff30;border-radius:14px;background:#253247;color:inherit;padding:12px 20px;font-weight:700}button:active{filter:brightness(1.25);transform:scale(.985)}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:22px;margin:0;letter-spacing:.08em}.subtitle{font-size:12px;color:#a8b8ce;margin:6px 0 0}.rule{font-size:13px;background:#253247;padding:10px 14px;border-radius:99px;white-space:nowrap}.board{display:grid;grid-template-columns:1fr 1fr;gap:18px}.player{--accent:#64d7ff;background:linear-gradient(145deg,#1c3c51,#172b40);border:1px solid #64d7ff40;border-radius:26px;padding:20px;text-align:center;min-width:0}.player.right{--accent:#ffcb79;background:linear-gradient(145deg,#49382d,#302c32);border-color:#ffcb7940}.name{width:100%;color:inherit;background:transparent;border:0;border-bottom:1px solid #ffffff25;text-align:center;font-size:clamp(20px,3vw,32px);font-weight:700;padding:6px 8px;border-radius:5px}.name-label{display:block;font-size:11px;color:#b3c1d2;margin-top:5px}.serve{display:inline-flex;align-items:center;justify-content:center;min-height:36px;margin-top:12px;padding:7px 16px;border-radius:99px;font-size:14px;color:#a9b6c8;background:#0002}.serve.active{background:var(--accent);color:#142333;font-weight:800}.score{display:block;width:100%;border:0;background:transparent;padding:0;line-height:1.1;font-size:clamp(100px,22vw,260px);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:var(--accent);border-radius:16px}.score:disabled{opacity:1}.tap{font-size:12px;color:#b8c4d4;margin:0 0 14px}.player-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.games{color:#c4cfdd;font-size:14px}.games strong{color:white;font-size:32px;margin-left:10px}.minus{background:#ffffff0c;min-width:104px}.status{text-align:center;padding:16px 8px;font-size:17px;font-weight:700;min-height:58px}.toolbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}.primary{background:#b8f17c;color:#1b2b13;border-color:transparent}.settings{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px;font-size:13px;color:#bcc8d9}select{max-width:220px;min-height:44px;border-radius:10px;background:#253247;border:1px solid #ffffff30;color:white;padding:8px}.hint{text-align:center;font-size:12px;color:#95a5bc;line-height:1.8;margin:15px 0 0}dialog{background:#1c293c;color:white;border:1px solid #ffffff40;border-radius:22px;max-width:440px;width:calc(100% - 32px);padding:26px}dialog::backdrop{background:#000a}dialog h2{margin-top:0;font-size:20px}dialog p{line-height:1.8;color:#c2cddd}.dialog-actions{display:flex;gap:10px;justify-content:flex-end}.history{text-align:center;color:#aebed2;font-size:13px;margin:14px 0 0;overflow-wrap:anywhere} @media(max-width:600px){body{padding:12px}.board{gap:10px}.player{padding:12px;border-radius:20px}header{gap:8px}h1{font-size:17px}.rule{font-size:11px;padding:8px}.subtitle{font-size:10px}.score{font-size:clamp(80px,25vw,150px)}.player-bottom{flex-direction:column}.games strong{font-size:25px}.minus{width:100%}.serve{font-size:12px;padding:7px 10px}.status{font-size:15px}}@media(min-width:700px) and (max-height:700px){header{margin-bottom:10px}.player{padding:12px 20px}.score{font-size:clamp(100px,25vh,190px)}.serve{margin-top:6px}.settings{margin-top:10px}.hint{margin-top:8px}}
</style>
</head>
<body>
<header><div><h1>卓球スコアボード</h1><p class="subtitle">TABLE TENNIS · タップでスコアを記録</p></div><span class="rule">11点制 ／ 2点差</span></header>
<main><div class="board">
<section class="player" aria-label="左の選手"><input class="name" id="name0" aria-label="左の選手・チーム名" maxlength="30" value="選手 A"><label class="name-label" for="name0">名前をタップして編集</label><div class="serve" id="serve0"></div><button class="score" id="score0" aria-label="左に1点追加">0</button><p class="tap">得点をタップして ＋1</p><div class="player-bottom"><span class="games">獲得ゲーム <strong id="games0">0</strong></span><button class="minus" id="minus0">−1 減点</button></div></section>
<section class="player right" aria-label="右の選手"><input class="name" id="name1" aria-label="右の選手・チーム名" maxlength="30" value="選手 B"><label class="name-label" for="name1">名前をタップして編集</label><div class="serve" id="serve1"></div><button class="score" id="score1" aria-label="右に1点追加">0</button><p class="tap">得点をタップして ＋1</p><div class="player-bottom"><span class="games">獲得ゲーム <strong id="games1">0</strong></span><button class="minus" id="minus1">−1 減点</button></div></section>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<div class="toolbar"><button id="next" class="primary" hidden>次のゲームへ →</button><button id="undo">↶ 1つ戻す</button><button id="resetGame">このゲームをリセット</button><button id="resetAll">全ゲームをリセット</button></div>
<div class="settings"><label for="first">第1ゲームの先行サーブ</label><select id="first"><option value="0">左の選手</option><option value="1">右の選手</option></select><span id="gameNumber"></span></div>
<p class="history" id="history"></p><p class="hint">サーブは2点ごと、10−10以降は1点ごとに交代。次のゲームは先行サーブも交代します。<br>ダブルスではチーム単位の目安です。最終ゲームの5点時のコート交代は手動で行ってください。<br><span id="saveHint">この端末に自動保存 · 通信不要で使えます</span></p>
</main>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialog-actions"><button id="cancel">キャンセル</button><button id="accept" class="primary">リセット</button></div></dialog>
<script>
'use strict';
const KEY='tt-scoreboard-ja-v1';
const fresh=()=>({names:['選手 A','選手 B'],points:[0,0],completed:[],first:0});
let state=fresh(),undoStack=[];
const $=id=>document.getElementById(id);
function valid(s){return s&&Array.isArray(s.names)&&s.names.length===2&&s.names.every(n=>typeof n==='string')&&pair(s.points)&&Array.isArray(s.completed)&&s.completed.every(pair)&&(s.first===0||s.first===1)}
function pair(p){return Array.isArray(p)&&p.length===2&&p.every(n=>Number.isSafeInteger(n)&&n>=0)}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state=saved}catch(e){}
function winner(p=state.points){return Math.max(...p)>=11&&Math.abs(p[0]-p[1])>=2?(p[0]>p[1]?0:1):null}
function server(){const total=state.points[0]+state.points[1];const switches=total<20?Math.floor(total/2):10+total-20;return (state.first+state.completed.length+switches)%2}
function name(i){return state.names[i].trim()||['選手 A','選手 B'][i]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('saveHint').textContent='通信不要で使えます · この環境では自動保存できません'}}
function snapshot(){undoStack.push(JSON.stringify(state));if(undoStack.length>150)undoStack.shift()}
function render(){const w=winner(),srv=server(),games=[0,0];state.completed.forEach(p=>{const win=winner(p);if(win!==null)games[win]++});if(w!==null)games[w]++;
for(let i=0;i<2;i++){$('score'+i).textContent=state.points[i];$('score'+i).disabled=w!==null;$('score'+i).setAttribute('aria-label',name(i)+'に1点追加、現在'+state.points[i]+'点');$('minus'+i).disabled=state.points[i]===0;$('games'+i).textContent=games[i];$('serve'+i).textContent=w!==null?(w===i?'✓ ゲーム獲得':'ゲーム終了'):(srv===i?'● サーブ':'レシーブ');$('serve'+i).classList.toggle('active',w===null&&srv===i);if(document.activeElement!==$('name'+i))$('name'+i).value=state.names[i]}
$('status').textContent=w!==null?name(w)+' がゲーム獲得！':state.points[0]>=10&&state.points[1]>=10?(state.points[0]===state.points[1]?'デュース · 2点差でゲーム獲得':'アドバンテージ · '+name(state.points[0]>state.points[1]?0:1)):Math.max(...state.points)>=10?'ゲームポイント · '+name(state.points[0]>state.points[1]?0:1):'得点をタップしてゲームを進めましょう';
$('next').hidden=w===null;$('undo').disabled=undoStack.length===0;$('first').value=state.first;$('first').disabled=state.completed.length>0||state.points.some(p=>p>0);$('gameNumber').textContent='第 '+(state.completed.length+1)+' ゲーム';$('history').textContent=state.completed.map((p,i)=>'第'+(i+1)+'ゲーム '+p[0]+'−'+p[1]).join(' ／ ');save()}
for(let i=0;i<2;i++){$('score'+i).onclick=()=>{if(winner()!==null)return;snapshot();state.points[i]++;render()};$('minus'+i).onclick=()=>{if(!state.points[i])return;snapshot();state.points[i]--;render()};$('name'+i).oninput=e=>{state.names[i]=e.target.value;render()}}
$('undo').onclick=()=>{if(undoStack.length){const names=state.names;state=JSON.parse(undoStack.pop());state.names=names;render()}};
$('next').onclick=()=>{if(winner()===null)return;snapshot();state.completed.push([...state.points]);state.points=[0,0];render()};
$('first').onchange=e=>{snapshot();state.first=Number(e.target.value);render()};
let pending=null;
function confirmReset(all){$('confirmTitle').textContent=all?'全ゲームをリセットしますか？':'このゲームをリセットしますか？';$('confirmText').textContent=all?'得点と獲得ゲーム数をすべて0に戻します。選手名と先行サーブの設定は残ります。':'現在のゲームを0−0に戻します。このゲームの獲得判定も取り消します。過去のゲームは残ります。';pending=()=>{snapshot();state.points=[0,0];if(all)state.completed=[];render()};$('confirm').showModal()}
$('resetGame').onclick=()=>confirmReset(false);$('resetAll').onclick=()=>confirmReset(true);$('cancel').onclick=()=>{$('confirm').close();pending=null};$('accept').onclick=()=>{if(pending)pending();pending=null;$('confirm').close()};render();
</script>
</body></html>
